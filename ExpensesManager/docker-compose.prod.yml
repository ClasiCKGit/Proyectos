# docker-compose.prod.yml  (producción)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: expense-manager

services:

  db:
    restart: always
    ports: []                            # no exponer MySQL al exterior en prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner                     # imagen de producción compilada
    restart: always
    volumes: []                          # sin bind-mounts en prod
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner                     # nginx sirviendo el build estático
      args:
        VITE_API_URL: ${VITE_API_URL}    # URL pública del backend
    restart: always
    volumes: []
    ports:
      - "80:80"

  # ─── Reverse proxy (opcional pero recomendado en prod) ──────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: expense_proxy
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # certificados SSL
    profiles:
      - proxy                              # activar con --profile proxy
