# docker-compose.yml  (desarrollo)
# Levanta: MySQL + backend con hot-reload + frontend con Vite dev server

name: expense-manager

services:

  # ─── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: expense_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expense_manager}
      MYSQL_USER: ${MYSQL_USER:-expense_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-expense_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner           # solo instala deps en dev; no compila
    container_name: expense_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://${MYSQL_USER:-expense_user}:${MYSQL_PASSWORD:-expense_pass}@db:3306/${MYSQL_DATABASE:-expense_manager}
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src          # hot-reload
      - ./backend/prisma:/app/prisma
    command: >
      sh -c "npx prisma db push --skip-generate &&
             npx tsx watch src/index.ts"

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder        # imagen con node para vite dev
    container_name: expense_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src         # hot-reload
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql_data:
